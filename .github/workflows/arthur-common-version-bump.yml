name: Arthur Common Version Bump

on:
  # Auto-release: a merge to main runs "Arthur Common CI"; when that run
  # succeeds we patch-bump the version. The resulting "Bump version" commit is
  # what "Arthur Common Release" keys off to build, publish to PyPI, and tag.
  # Gating on the CI run (rather than the push itself) is what keeps a red build
  # from reaching PyPI: no green run, no bump, no publish. The "Confirm main
  # matches the validated commit" step below is what makes that airtight —
  # without it we would bump the tip of main even when the tip has moved past
  # the commit CI actually checked.
  workflow_run:
    workflows: ["Arthur Common CI"]
    types:
      - completed
  # Dependency-only sweep. The job's message denylist keeps Renovate merges from
  # each cutting a release, which otherwise means a dependency change can sit on
  # main unreleased indefinitely — and for a published library the dependency
  # constraints ARE part of what consumers install. This daily run bumps only
  # if pyproject.toml or src/ changed since the last "Bump version" commit (and
  # CI is green on the tip), so dependency updates reach PyPI within ~24h
  # without a release per PR. Daily rather than weekly because arthur-engine
  # pins arthur-common and shares its dependencies (litellm, pydantic, pandas,
  # ...): arthur-common has to publish a bump before arthur-engine's Renovate
  # can move the same dependency without a resolver conflict. A day with
  # nothing new to publish is a no-op — no commit, no tag, no publish. That
  # includes days whose only merge is Renovate's nightly lock file maintenance:
  # uv.lock is not part of the wheel.
  schedule:
    - cron: "0 9 * * *" # Daily 09:00 UTC (05:00 ET)
  # Still available for major/minor bumps, which are never automatic.
  workflow_dispatch:
    inputs:
      intent:
        description: 'Trigger version bump'
        required: true
        default: 'bump_version'
        type: string
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Two merges landing close together produce two CI runs and therefore two
# bumps. Serialize them so the second bumps from an up-to-date main instead of
# racing the first on `git push`.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    environment: shared-protected-branch-secrets
    # Manual dispatch, or a green CI run on main whose commit is worth
    # releasing. The message denylist mirrors arthur-engine's
    # version-workflow.yml:
    #   - "Bump version"  our own bump commit. Without this the bump push
    #                     triggers CI, which triggers another bump, forever.
    #   - renovate/*      dependency and lock-file churn. Renovate merges its own
    #                     PRs unattended now (see renovate-auto-approve.yml), so
    #                     this list is load-bearing: anything it misses ships a
    #                     release with no human in the loop.
    #                     The startsWith entries are the primary check. Renovate's
    #                     auto-merges land as "<PR title> (#N)" merge commits,
    #                     whatever the repo's merge_commit_title setting (every
    #                     one in Sep-Oct 2026 did), so the message carries no
    #                     branch ref and each title form Renovate can produce
    #                     needs an entry. Note the grouped title ("Update python
    #                     minor and patch") is NOT of the form "Update
    #                     dependency X", so it needs its own.
    #                     `contains 'renovate/'` only catches a Renovate PR that
    #                     a person merges by hand, which gets GitHub's "Merge
    #                     pull request #N from arthur-ai/renovate/..." title.
    # Dependency bumps still ship — either batched into the next release that
    # carries a source change, or by the daily `schedule` sweep above if no such
    # change arrives first.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.intent == 'bump_version') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'Bump version') &&
       !contains(github.event.workflow_run.head_commit.message, 'renovate/') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'Update dependency') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'Update python minor and patch') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'Lock file maintenance') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(deps)') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'fix(deps)'))
    runs-on: ubuntu-latest
    # The push uses the app token persisted by checkout; GITHUB_TOKEN only needs
    # to read CI run results for the schedule gate.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Generate Arthur GitHub Automator App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ARTHUR_GH_AUTOMATOR_APP_ID }}
          private-key: ${{ secrets.ARTHUR_GH_AUTOMATOR_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          # Full history + tags: the schedule gate below diffs main against
          # the most recent "Bump version" commit and checks it was tagged.
          fetch-depth: 0
          # workflow_run checks out the triggering SHA by default; bump from the
          # tip of main so the push is a fast-forward. The gate step then
          # confirms that tip is the commit CI actually validated.
          ref: main
          token: ${{ steps.generate-token.outputs.token }}
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
      - name: Confirm main matches the validated commit
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "$EVENT" in
            workflow_dispatch)
              # A human asked for this bump explicitly; releasing whatever is on
              # main is the intent.
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              # We check out the tip of main, but CI only vouched for
              # VALIDATED_SHA. If another merge landed in between, the tip
              # contains code no green run has covered, and publishing it would
              # break the "no unvalidated build reaches PyPI" guarantee.
              # Skipping loses nothing: the newer commit has its own CI run,
              # which reaches this job with the tip and its SHA in agreement.
              TIP=$(git rev-parse HEAD)
              if [ "$TIP" != "$VALIDATED_SHA" ]; then
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                echo "::notice::main is at $TIP but CI validated $VALIDATED_SHA; a later run will bump."
              else
                echo "proceed=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            schedule)
              # Release only if what gets published has changed since the last
              # release was cut.
              #
              # The release point is the newest "Bump version" commit on main —
              # the same marker arthur-common-release.yml keys off — not the
              # newest tag. That workflow pushes the tag only after PyPI publish
              # succeeds, so measuring from the tag would count a failed or
              # still-running release's own bump commit as unreleased work and
              # cut another version on every sweep.
              RELEASE_POINT=$(git log --first-parent -1 --format=%H \
                                --grep='^Bump version: [0-9]' HEAD)
              if [ -z "$RELEASE_POINT" ]; then
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                echo "::warning::No 'Bump version' commit found on main, so there is no release point to compare against; skipping. Dispatch a bump manually."
              else
                RELEASE=$(git log -1 --format='%s (%h)' "$RELEASE_POINT")
                # Only pyproject.toml (dependency constraints, metadata) and
                # src/ (the package) reach the wheel. Everything else — above
                # all uv.lock, which Renovate's lock file maintenance rewrites
                # most nights — changes nothing a consumer installs, so it must
                # not cut a release on its own.
                CHANGED=$(git diff --name-only "$RELEASE_POINT" HEAD -- pyproject.toml src/)
                if [ -n "$CHANGED" ]; then
                  echo "Published inputs changed since $RELEASE:"
                  echo "$CHANGED"
                  # The sweep has no workflow_run to vouch for the tip, so look
                  # up "Arthur Common CI" on it directly: a red or still-running
                  # build must not reach PyPI. Skipping is safe — tomorrow's
                  # sweep (or the next workflow_run bump) picks it up.
                  TIP=$(git rev-parse HEAD)
                  CI=$(gh run list --repo "$GITHUB_REPOSITORY" \
                         --workflow "Arthur Common CI" --event push \
                         --commit "$TIP" --limit 1 \
                         --json conclusion --jq '.[0].conclusion // ""')
                  if [ "$CI" = "success" ]; then
                    echo "proceed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "proceed=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::CI on $TIP is '${CI:-not found}', not success; skipping until it is green."
                  fi
                else
                  echo "proceed=false" >> "$GITHUB_OUTPUT"
                  echo "::notice::Nothing published has changed since $RELEASE; nothing to do."
                  # A release point without a tag means its release failed or
                  # is still running. Bumping again here would cut one more
                  # version every day it stays stuck — a duplicate of what is
                  # already on PyPI if only the tag step failed — so flag it
                  # for a human instead.
                  if [ -z "$(git tag --points-at "$RELEASE_POINT")" ]; then
                    echo "::warning::$RELEASE has no release tag: its 'Arthur Common Release' run failed or is still running. Not bumping again; re-run that release if it failed."
                  fi
                fi
              fi
              ;;
            *)
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Unexpected event '$EVENT'; refusing to bump."
              ;;
          esac
      - name: Bump version
        if: steps.gate.outputs.proceed == 'true'
        env:
          BUMP_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type || 'patch' }}
        run: |
          echo "Bump type: $BUMP_TYPE"

          # Rewrites pyproject.toml AND uv.lock's own version entry, then
          # commits both — see .bumpversion.cfg. It fails loudly if either file
          # no longer contains the expected current version.
          uvx bump2version "$BUMP_TYPE"

          git status

          # Only the branch — the release tag is pushed by the Release
          # workflow's create-git-tag job, after PyPI publish succeeds.
          git push origin HEAD:main
