name: Arthur Common CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-linter:
    runs-on: ubuntu-latest
    env:
      SKIP: pytest-check,changelog-check
      GIT_DEPTH: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/setup-uv
      - name: Run linters
        run: |
          uv run autoflake src/
          uv run isort src/
          uv run black src/
          uv run mypy --config-file pyproject.toml src/

  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - uses: ./.github/workflows/composite-actions/setup-git
          with:
            safe-directory: ${{ runner.workspace }}
        - uses: ./.github/workflows/composite-actions/setup-uv
        - name: Run unit tests
          shell: bash
          run: |
            set -o pipefail
            uv run pytest tests/unit/ --cov --cov=src/arthur_common \
            --cov-report term \
            --junitxml=report.xml \
            | tee pytest-coverage.txt
        - name: Pytest coverage comment
          if: always()
          uses: MishaKav/pytest-coverage-comment@main
          with:
            pytest-coverage-path: pytest-coverage.txt
            junitxml-path: report.xml
            title: Coverage Report
        - name: Upload coverage report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-results
            path: |
              report.xml
              pytest-coverage.txt
