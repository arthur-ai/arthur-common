name: Arthur Common — LTS Release

# LTS publish pipeline. Independent from `arthur-common-release.yml`
# which handles continuous releases.
#
# Strategy: build a wheel from the tagged LTS commit. The lts-management
# orchestrator writes `pyproject.toml` with the PEP 440 `.post` form
# (e.g. `1.5.0.post0` for the initial LTS cut, `1.5.0.postN` for patches)
# and pushes the LTS tag (`X.Y.Z-lts` / `X.Y.Z-lts-patch-N`) which
# triggers this workflow. PyPI versions are immutable so we cannot
# retag — the build is mandatory.
#
# Trigger: tag matching `*-lts` (initial) or `*-lts-patch-*` (patch).
# Both are simple human-readable globs. No commit-message gates, no
# branch gates, no shared logic with the continuous workflow.

on:
  push:
    tags:
      - '*-lts'
      - '*-lts-patch-*'

jobs:
  pypi-build:
    name: Build LTS wheel
    runs-on: ubuntu-latest
    env:
      GIT_DEPTH: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
          ref: ${{ github.ref }}
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      - uses: ./.github/workflows/composite-actions/setup-uv
      - name: Build wheel
        run: uv build
      - name: List artifacts
        run: ls -la dist/
      - name: Archive wheel
        uses: actions/upload-artifact@v4
        with:
          name: arthur-common-lts
          path: dist/
          retention-days: 1
          if-no-files-found: error

  pypi-publish:
    name: Publish LTS wheel to PyPI
    needs: pypi-build
    runs-on: ubuntu-latest
    environment:
      name: shared-protected-branch-secrets
      url: https://pypi.org/project/arthur-common/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arthur-common-lts
          path: dist
      - run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
