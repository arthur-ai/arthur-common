name: Arthur Common Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build dev release from (only used for dev releases)'
        required: false
        type: string
      pypi_api_token:
        description: 'PyPI API token for dev releases (required for dev releases)'
        required: false
        type: string

jobs:
  pypi-build:
    # Should be separate from publish job: https://docs.pypi.org/trusted-publishers/security-model/#:~:text=Retrieve%20the%20publishable%20distribution%20files%20from%20a%20separate%20build%20job%3B
    # written from guide: https://johnfraney.ca/blog/how-to-publish-a-python-package-with-poetry-and-github-actions/
    name: Build release for PyPI
    if: startsWith(github.event.head_commit.message, 'Bump version') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      dev_version: ${{ steps.get-dev-version.outputs.dev_version }}
      is_dev_release: ${{ steps.determine-release-type.outputs.is_dev_release }}
    env:
      GIT_DEPTH: 100
    permissions:
      contents: read
    steps:
      - name: Determine release type
        id: determine-release-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_dev_release=true" >> "$GITHUB_OUTPUT"
            echo "Release type: Dev release"
          else
            echo "is_dev_release=false" >> "$GITHUB_OUTPUT"
            echo "Release type: Official release"
          fi
      
      - name: Determine checkout ref
        id: checkout-ref
        run: |
          if [ "${{ steps.determine-release-type.outputs.is_dev_release }}" = "true" ]; then
            if [ -n "${{ github.event.inputs.branch }}" ]; then
              echo "ref=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
            else
              echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.GIT_DEPTH }}
          ref: ${{ steps.checkout-ref.outputs.ref }}
      
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      
      - uses: actions/setup-python@v5
        # can't use container with python instead: https://github.com/pypa/gh-action-pypi-publish/tree/unstable/v1#:~:text=Running%20the%20action,that%20publishes%20them.
        with:
          python-version: 3.12
      
      - uses: ./.github/workflows/composite-actions/setup-poetry
        with:
          poetry-version: 2.1.3
      
      - name: Get current version and calculate dev version (dev releases only)
        id: get-dev-version
        if: steps.determine-release-type.outputs.is_dev_release == 'true'
        run: |
          # Get current version from pyproject.toml
          CURRENT_VERSION=$(poetry version --short)
          echo "Current version: $CURRENT_VERSION"
          
          # Fetch all tags to get existing dev versions
          echo "Fetching git tags to find existing dev versions..."
          git fetch --tags origin
          
          # Find existing dev versions for the current base version
          BASE_VERSION="$CURRENT_VERSION"
          EXISTING_DEV_TAGS=$(git tag -l "${BASE_VERSION}.dev*" | sort -V)
          
          if [ -z "$EXISTING_DEV_TAGS" ]; then
              # No existing dev tags, start with .dev1
              NEXT_DEV_NUMBER=1
          else
              # Extract the highest dev number
              HIGHEST_DEV_NUMBER=$(echo "$EXISTING_DEV_TAGS" | sed "s/${BASE_VERSION}\.dev//" | sort -n | tail -1)
              NEXT_DEV_NUMBER=$((HIGHEST_DEV_NUMBER + 1))
          fi
          
          DEV_VERSION="${BASE_VERSION}.dev${NEXT_DEV_NUMBER}"
          echo "Calculated dev version: $DEV_VERSION"
          echo "dev_version=$DEV_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
      
      - name: Package project (official release)
        if: steps.determine-release-type.outputs.is_dev_release == 'false'
        run: poetry build
      
      - name: Package project with dev version (dev release)
        if: steps.determine-release-type.outputs.is_dev_release == 'true'
        run: |
          DEV_VERSION="${{ steps.get-dev-version.outputs.dev_version }}"
          echo "Building package with dev version: $DEV_VERSION"
          poetry build --config-settings local-version=$DEV_VERSION
      
      - name: List build artifacts
        run: ls -la dist/
      
      - name: Archive package
        uses: actions/upload-artifact@v4
        with:
          name: arthur-common
          path: dist/
          retention-days: 1
          if-no-files-found: error

  pypi-publish-official:
    # don't add more steps to this job—it should only publish so that steps with access to the OIDC token for use with
    # PyPI are as limited as possible
    needs: pypi-build
    name: Upload official release to PyPI
    if: (startsWith(github.event.head_commit.message, 'Bump version') || github.event_name == 'workflow_dispatch') && needs.pypi-build.outputs.is_dev_release == 'false'
    runs-on: ubuntu-latest
    environment:  # must be the same as what is set for the trusted publisher in PyPI
      name: shared-protected-branch-secrets
      url: https://pypi.org/project/arthur-common/
    permissions:
      contents: read
      id-token: write  # needed for PyPI trusted publishing
    steps:
        - name: Download distribution from pypi-build job
          uses: actions/download-artifact@v4
          with:
            name: arthur-common
            path: dist
        - name: List downloaded artifacts
          run: ls -la dist/
        - name: Publish package distributions to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
          with:
            packages-dir: dist
        - name: Output release info
          run: |
            echo "✅ Official release published successfully!"
            echo "🔗 PyPI URL: https://pypi.org/project/arthur-common/"

  pypi-publish-dev:
    # Dev releases use API token authentication instead of trusted publishing
    needs: pypi-build
    name: Upload dev release to PyPI
    if: (startsWith(github.event.head_commit.message, 'Bump version') || github.event_name == 'workflow_dispatch') && needs.pypi-build.outputs.is_dev_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
        - name: Validate PyPI API token input
          if: github.event_name == 'workflow_dispatch'
          run: |
            if [ -z "${{ github.event.inputs.pypi_api_token }}" ]; then
              echo "::error::PyPI API token is required for dev releases"
              exit 1
            fi
        - name: Download distribution from pypi-build job
          uses: actions/download-artifact@v4
          with:
            name: arthur-common
            path: dist
        - name: List downloaded artifacts
          run: ls -la dist/
        - name: Mask PyPI API token in logs
          run: echo "::add-mask::${{ github.event.inputs.pypi_api_token }}"
        - name: Publish package distributions to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
          with:
            packages-dir: dist
            username: __token__
            password: ${{ github.event.inputs.pypi_api_token }}
        - name: Output release info
          run: |
            echo "✅ Dev release published successfully!"
            echo "📦 Version: ${{ needs.pypi-build.outputs.dev_version }}"
            echo "🔗 PyPI URL: https://pypi.org/project/arthur-common/"

  create-git-tag:
    needs: [pypi-build, pypi-publish-official, pypi-publish-dev]
    name: Create git tag for release
    if: |
      (startsWith(github.event.head_commit.message, 'Bump version') || github.event_name == 'workflow_dispatch') &&
      (
        (needs.pypi-build.outputs.is_dev_release == 'false' && needs.pypi-publish-official.result == 'success') ||
        (needs.pypi-build.outputs.is_dev_release == 'true' && needs.pypi-publish-dev.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine checkout ref and tag version
        id: tag-info
        run: |
          if [ "${{ needs.pypi-build.outputs.is_dev_release }}" = "true" ]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            if [ -n "${{ github.event.inputs.branch }}" ]; then
              echo "ref=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
            else
              echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            fi
            echo "tag=${{ needs.pypi-build.outputs.dev_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag-info.outputs.ref }}
      
      - uses: ./.github/workflows/composite-actions/setup-git
        with:
          safe-directory: ${{ runner.workspace }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      
      - uses: ./.github/workflows/composite-actions/setup-poetry
        with:
          poetry-version: 2.1.3
      
      - name: Get version for official release
        if: steps.tag-info.outputs.is_dev == 'false'
        id: get-version
        run: |
          VERSION=$(poetry version --short)
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      
      - name: Create and push git tag
        run: |
          if [ "${{ steps.tag-info.outputs.is_dev }}" = "true" ]; then
            TAG="${{ needs.pypi-build.outputs.dev_version }}"
            echo "Creating dev release tag: $TAG"
          else
            TAG="${{ steps.get-version.outputs.version }}"
            echo "Creating official release tag: $TAG"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "✅ Release tag $TAG created and pushed"
