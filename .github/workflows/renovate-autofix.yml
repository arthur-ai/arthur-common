name: Renovate Auto-Fix

# When "Arthur Common CI" fails on a Renovate PR, let Claude adapt the source to
# the updated dependency, verify the real required checks pass, self-review the
# change and address its own findings, then push the fix. Ported from
# arthur-engine's renovate-autofix.yml.
#
# DIFFERENCE FROM ARTHUR-ENGINE, DELIBERATE: arthur-engine's version of this
# workflow approves the PR itself, which forced an elaborate "approve pinned to
# the fix SHA and confirm it stuck" retry loop (a bare approve races the push and
# gets dismissed by dismiss_stale_reviews_on_push). arthur-common does not need
# that: pushing the fix as the Automator App triggers a fresh CI run, and
# renovate-auto-approve.yml approves on that run's success. So the approval path
# is identical for fixed and unfixed PRs, and there is exactly one place in the
# repo that can approve a dependency PR. renovate-auto-approve.yml must therefore
# accept the Automator App as a CI actor, not only renovate[bot] — the two files
# are coupled, keep the actor lists in sync.
#
# Safety model (three layers):
#   1. Claude self-verifies: it re-runs the real checks and only signals success
#      (by writing a marker OUTSIDE the repo) if everything passes; otherwise it
#      discards its edits and comments. Nothing broken is ever committed.
#   2. Required checks are the hard gate: `run-linter` and `run-unit-tests` must
#      pass on the pushed fix before renovate-auto-approve.yml will approve it,
#      and main-ruleset requires them before merge. This workflow cannot bypass
#      that — it holds no ruleset bypass.
#   3. Scope/tool guards: only renovate/* branches, only on CI failure, a bounded
#      retry budget (3 attempts, then it hands off to a human), and the prompt
#      forbids weakening checks or touching CI/test/dependency-pin files.
#
# Major-version PRs are fixed but never approved: they carry Renovate's `major`
# label and not `automerge-safe`, so renovate-auto-approve.yml skips them by
# construction. This workflow additionally flags the title for human attention.
#
# This is a workflow_run listener; it only becomes active once merged to the
# default branch (main), and always runs the default-branch version of itself, so
# a PR cannot tamper with the fixer that runs against it.

on:
  workflow_run:
    workflows: ["Arthur Common CI"]
    types: [completed]

permissions: {}

concurrency:
  group: renovate-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  autofix:
    # Only failed CI runs from a same-repo Renovate PR branch. Every signal
    # matters and none is sufficient alone:
    #   - head_repository == this repo -> reject fork-originated runs (this job
    #     holds write creds; a fork must never reach it).
    #   - actor is a trusted bot -> the failing run was pushed by Renovate OR by
    #     our own Automator App (the identity that pushes Claude's fix). Allowing
    #     the Automator App is what lets a failed *retry* re-trigger this job; a
    #     human who merely pushed a renovate/* branch is still rejected. The PR
    #     author is re-checked against the API below.
    #   - head_branch renovate/* -> narrows to dependency branches.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.actor.login == 'renovate[bot]' ||
        github.event.workflow_run.actor.login == 'arthur-github-automator-app[bot]'
      ) &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    # Needed to read the Arthur GitHub Automator App credentials.
    environment: shared-protected-branch-secrets
    permissions:
      contents: write # push the fix commit
      pull-requests: write # label + comment + retitle
      actions: read # read the failed CI logs
      id-token: write
    steps:
      - name: Generate Automator App token (push identity)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ARTHUR_GH_AUTOMATOR_APP_ID }}
          private-key: ${{ secrets.ARTHUR_GH_AUTOMATOR_APP_PRIVATE_KEY }}

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PAYLOAD_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          NUM="$PAYLOAD_PR"
          if [ -z "$NUM" ] || [ "$NUM" = "null" ]; then
            # Fallback for same-repo runs where the payload omits the PR link.
            # Constrained to Renovate-authored PRs so a colliding branch name
            # cannot steer us onto someone else's PR.
            NUM=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" \
              --author 'app/renovate' --state open --json number --jq '.[0].number // empty')
          fi
          if [ -z "$NUM" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No open Renovate PR found for branch $HEAD_BRANCH; nothing to fix."
            exit 0
          fi
          # Defence in depth: confirm the PR really is Renovate-authored before
          # this job ever pushes to it.
          AUTHOR=$(gh api "repos/$REPO/pulls/$NUM" --jq '.user.login')
          if [ "$AUTHOR" != "renovate[bot]" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR #$NUM author is '$AUTHOR', not renovate[bot]; refusing to act."
            exit 0
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          # Push identity = the Automator App.
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@v5
        if: steps.pr.outputs.found == 'true'
        with:
          version: "0.11.7"

      - name: Retry budget guard
        id: guard
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          # Each Claude fix adds one [claude-autofix] commit, so the count
          # reachable from HEAD is how many times Claude has already tried on
          # this branch head. This lets a failed fix be retried (with the new
          # failure logs) up to the budget instead of giving up after one go. A
          # Renovate rebase drops these commits and resets the budget, which is
          # the desired behaviour.
          ATTEMPTS=$(git log --format=%s | grep -cF '[claude-autofix]' || true)
          echo "Prior auto-fix attempts on this branch: ${ATTEMPTS}/${MAX_ATTEMPTS}."
          if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Reached ${MAX_ATTEMPTS} auto-fix attempts; handing off to a human."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
              "🤖 Auto-fix gave up after ${MAX_ATTEMPTS} attempts — CI is still failing on this dependency update. It needs a human." || true
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude auto-fix (edits + self-verify only; no commit)
        if: steps.guard.outputs.proceed == 'true'
        # The success marker lives OUTSIDE the repo (in RUNNER_TEMP) so it cannot
        # be committed to the PR branch to forge a "verified" signal.
        env:
          AUTOFIX_MARKER: ${{ runner.temp }}/claude-autofix-success
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Allow the action to run even though the PR was authored by a bot.
          allowed_bots: "renovate[bot]"
          additional_permissions: |
            actions: read
          # Opus at xhigh effort: these fixes require reading unfamiliar
          # dependency APIs and reasoning about breakage, and the same run also
          # self-reviews.
          claude_args: '--model opus --effort xhigh --allowed-tools "Bash,Read,Edit,Write,Glob,Grep"'
          prompt: |
            A Renovate dependency-update PR (#${{ steps.pr.outputs.number }}) on this branch has FAILING CI.
            The failed run is: ${{ github.event.workflow_run.html_url }} (run id ${{ github.event.workflow_run.id }}).
            You are on the checked-out PR branch. Your objective: make the MINIMAL source-code changes
            needed to adapt the code to the updated dependency so ALL required checks pass — WITHOUT
            weakening any check. Do not break anything.

            NOTE: this may be a retry. If the branch already contains a `[claude-autofix]` commit, a
            previous attempt did not fully pass — the failing run above reflects what that fix got
            wrong. Read those logs, understand the remaining failure, and build on the prior fix
            rather than repeating it.

            WHICH CHECKS ACTUALLY GATE THIS REPO (read carefully — it is not what it looks like):
            The `run-linter` job runs `autoflake`/`isort`/`black` with in-place config
            (`[tool.autoflake] in-place = true`, and isort/black are invoked without `--check`), so
            those REWRITE files and exit 0. They cannot fail the build. The two things that actually
            fail CI are:
              - `mypy --strict` in the `run-linter` job, and
              - `pytest tests/unit/` in the `run-unit-tests` job.
            Also possible: dependency resolution failing during `uv sync` before either job's checks
            run (see RELEASE-AGE SOAK below). Diagnose which of these it is FIRST; do not assume a
            formatting problem.

            IN SCOPE (code adaptation only), all under `src/arthur_common`:
              - mypy strict type errors caused by the dependency's changed type signatures
              - unit-test adaptations that are a legitimate consequence of the dependency's changed
                behavior (tests live in `tests/unit/`; `[tool.mypy] exclude` skips `tests`)

            OUT OF SCOPE — if the failure is any of these, STOP, change nothing, and post a PR comment
            (`gh pr comment ${{ steps.pr.outputs.number }} -b "..."`) explaining it needs a human:
              - Dependency-resolution / lockfile conflicts (e.g. "No solution found when resolving
                dependencies", incompatible version pins between packages).
              - Anything that would require changing a version pin or lockfile to resolve.

            RELEASE-AGE SOAK (a specific out-of-scope case — flag it precisely instead of just "needs a
            human"): the blocker is that a NEWER release of a dependency WOULD fix the build but is being
            held back by this repo's 3-day soak — `minimumReleaseAge` in /renovate.json and
            `exclude-newer = "3 days"` under `[tool.uv]` in /pyproject.toml. Tell-tale signs: `uv lock`
            reports the fixing version is unavailable / "not at the requested version", OR a package
            imports a symbol that a just-updated dependency renamed/removed and that dependency's compat
            patch was published less than 3 days ago. When you identify this, IN ADDITION to the
            explanatory comment, label the PR so humans can see it is a timing hold, not a defect:
              `gh pr edit ${{ steps.pr.outputs.number }} --add-label "blocked: release-age soak"`
            In the comment, name the package, the exact version that fixes it, and the UTC timestamp it
            clears the soak (the fixing release's upload time + 3 days). Do NOT change any pin, lockfile,
            or `exclude-newer` value to pull it in early — the soak is deliberate. (The label pre-exists
            in the repo and `pull-requests: write` is enough to apply it; if the `add-label` call ever
            fails because the label is missing, skip it and rely on the comment — do not block on it.)

            HARD RULES (never violate — these protect the "don't break anything" objective):
              - Do NOT edit anything under .github/, any CI config, pyproject.toml version pins,
                `[tool.uv] exclude-newer`, uv.lock, .bumpversion.cfg, or renovate.json.
              - Do NOT silence checks: no `# type: ignore`, no `# noqa`, no pytest skip/xfail, no
                coverage reductions, no loosening of `[tool.mypy] strict`. Fix the real cause.
              - Do NOT lower test coverage: pre-commit enforces a 45% minimum.
              - Prefer the smallest change that addresses the dependency's actual API/behavior change.

            PROCESS:
              1. Read the failures: `gh run view ${{ github.event.workflow_run.id }} --log-failed`.
              2. Set up: `uv sync --all-groups --frozen`
                 (if this step itself fails to resolve, that is the soak/resolution case above).
              3. Reproduce the failures with the same commands CI uses:
                 - types: `uv run mypy --config-file pyproject.toml src/`
                 - tests: `uv run pytest tests/unit/ --cov --cov=src/arthur_common --cov-report term`
              4. Fix the root cause in `src/arthur_common`. Afterwards run the in-place formatters so the
                 diff matches what pre-commit would produce locally:
                 `uv run autoflake src/ && uv run isort src/ && uv run black src/`
              5. VERIFY: re-run mypy and pytest from step 3 and confirm they BOTH pass.
              6. SELF-REVIEW your own diff as a critical, adversarial reviewer — this review gates the
                 merge. Run `git diff` and judge: (a) does it genuinely adapt to the dependency's changed
                 API/behaviour rather than mask the symptom? (b) does it introduce any behaviour change
                 beyond that adaptation? (c) any correctness bugs? (d) does it silence/weaken any check
                 (forbidden)? (e) is it the minimal change? Post a short review summary (findings +
                 verdict) as a PR comment: `gh pr comment ${{ steps.pr.outputs.number }} -b "..."`.
              7. ADDRESS every actionable finding from your review, then RE-RUN mypy and pytest and
                 confirm they still pass. Repeat review -> address until your review has no unaddressed
                 actionable findings.
              8. ONLY IF both checks pass AND your review is clean: write the file at the path in the env
                 var $AUTOFIX_MARKER (it is OUTSIDE the repo — run `echo ok > "$AUTOFIX_MARKER"`), and
                 leave your edits in the working tree. DO NOT commit or push, and do NOT create any
                 marker file inside the repo.
              9. IF you cannot fully fix it safely, or your review surfaces a problem you cannot resolve
                 with a safe minimal change: run `git checkout -- . && git clean -fd` to discard all
                 edits, do NOT write the marker, and post the explanatory PR comment.

            A later step commits & pushes ONLY if $AUTOFIX_MARKER exists, so the marker means "fixed,
            self-reviewed, and review findings addressed". The pushed fix still has to pass the full
            required suite on a fresh CI run before anything approves or merges it. Never leave broken,
            unreviewed, or unverified edits.

      - name: Commit and push the fix; flag majors
        if: steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          AUTOFIX_MARKER: ${{ runner.temp }}/claude-autofix-success
          APP_ID: ${{ secrets.ARTHUR_GH_AUTOMATOR_APP_ID }}
        run: |
          set -euo pipefail
          if [ ! -f "$AUTOFIX_MARKER" ]; then
            echo "No verified fix was produced; leaving the PR for a human."
            exit 0
          fi
          # Use porcelain so NEW (untracked) files count as a change; `git diff`
          # alone would miss them and silently drop a valid fix.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Success marker present but no file changes; nothing to push."
            exit 0
          fi

          git config user.name "arthur-github-automator[bot]"
          git config user.email "${APP_ID}+arthur-github-automator[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(deps): auto-resolve CI failures from dependency update [claude-autofix]"

          # Push with the app token EXPLICITLY (checkout's persisted credential is
          # gone — claude-code-action rewrites the workspace git auth during its
          # run). The push is x-access-token, so GitHub attributes it to the
          # Automator App, which both re-triggers CI and is an actor
          # renovate-auto-approve.yml accepts. NOT a force push: if Renovate
          # rebased this branch while Claude worked, this is a non-fast-forward
          # and is rejected — safe, a newer run handles the new head.
          git push "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git" \
            "HEAD:$HEAD_BRANCH"

          # Major bumps carry Renovate's `major` label and never carry
          # `automerge-safe`, so renovate-auto-approve.yml already refuses to
          # approve them. Flag the title so the human review they need is
          # obvious in the PR list.
          IS_MAJOR=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq 'any(.labels[]; .name == "major")')
          if [ "$IS_MAJOR" = "true" ]; then
            TITLE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq '.title')
            case "$TITLE" in
              "⚠️ major update"*) : ;; # already flagged on a previous attempt; don't stack
              *) gh pr edit "$PR_NUMBER" --repo "$REPO" \
                   --title "⚠️ major update — human review required: $TITLE" ;;
            esac
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
              "🤖 Applied an auto-fix so CI passes, but this is a **major** dependency update, so it is **not** auto-approved. A human should review and approve before it merges."
            exit 0
          fi

          echo "Fix pushed. A fresh CI run will gate it, and renovate-auto-approve.yml approves on success."
