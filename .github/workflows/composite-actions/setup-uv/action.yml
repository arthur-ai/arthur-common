name: 'Setup uv'
description: 'Installs uv and syncs dependencies'

runs:
  using: 'composite'
  steps:
    - name: 'Install uv'
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.11.7"
        # Pin the interpreter: ubuntu-latest moved to 26.04, whose system Python
        # 3.14 has no datasketches wheel, and building it from source fails.
        python-version: "3.12"
    - name: 'Install dependencies'
      shell: bash
      run: uv sync --all-groups --frozen
