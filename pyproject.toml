[project]
name = "arthur-common"
version = "0.0.14.post0"
description = "Utility code common to Arthur platform components."
authors = [{name = "Arthur", email = "engineering@arthur.ai"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typing-extensions>=4.7.1",
    "pandas>=2.2.2,<3.0.0",
    "duckdb>=1.5.2",
    "datasketches>=5.1.0",
    "types-requests>=2.32.0.20241016",
    "types-python-dateutil>=2.9.0",
    "fsspec>=2024.10.0",
    "litellm==1.83.4",
    "fastapi>=0.115.8",
    "simple-settings>=1.2.0",
    "openinference-semantic-conventions>=0.1.12,<0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "responses==0.25.7",
    "pytest-xdist==3.6.1",
    "pytest-cov>=6.1.1,<7",
    "pre-commit>=4.2.0,<5",
    "pandas-stubs>=2.3.3,<2.4",
]
linters = [
    "autoflake>=2.3.1,<3",
    "isort>=6.0.1,<7",
    "black>=25.1.0,<26",
    "mypy>=1.17.0,<2",
]

[tool.uv]
exclude-newer = "3 days"

[tool.autoflake]
remove-all-unused-imports = true
in-place = true
recursive = true


[tool.isort]
profile = "black"
src_paths = ["src"]


[tool.black]
target-version = ['py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  06
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
ignore_missing_imports = true
implicit_reexport = true
explicit_package_bases = true
strict = true
exclude = ["clients/python", "alembic_app_db", "alembic_ts_db", "tests"]
namespace_packages = true
mypy_path = "src"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arthur_common"]
