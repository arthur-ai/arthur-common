[bumpversion]
current_version = 2.4.68
commit = True
tag = True
tag_name = {new_version}
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
serialize = {major}.{minor}.{patch}

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

# uv.lock records the project's own version too, and it used to drift because
# only pyproject.toml was bumped. Harmless in CI (`uv sync --frozen` does not
# verify freshness) but any local `uv run`/`uv lock` silently re-resolved and
# dirtied the lock — noisy now that every merge to main bumps. A Renovate
# lockfile update happens to resync it as a side effect, so the drift came and
# went; bumping it here makes it deterministic instead of incidental.
#
# The search is deliberately two lines: `version = "X"` alone appears once per
# locked package, so a single-line search would rewrite an unrelated dependency
# that happened to share arthur-common's version number. Anchoring on the
# preceding `name` line pins it to this package's own [[package]] entry.
# bump2version raises VersionNotFoundException if this drifts again, so it fails
# loudly at bump time rather than publishing a mismatched lock.
[bumpversion:file:uv.lock]
search = name = "arthur-common"
	version = "{current_version}"
replace = name = "arthur-common"
	version = "{new_version}"
